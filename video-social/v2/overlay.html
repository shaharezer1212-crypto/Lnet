<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Gazoz;src:url(../../assets/fonts/FbGazoz-Bold.otf)}
@font-face{font-family:Josefin;src:url(../../assets/fonts/JosefinSans.ttf);font-weight:100 900}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
body{font-family:Gazoz,Josefin,sans-serif;color:#141414}
.cap{position:absolute;top:250px;right:80px;left:80px;text-align:center;opacity:0}
.cap .glow{position:absolute;inset:-70px -60px;background:radial-gradient(closest-side,rgba(250,249,246,.92),rgba(250,249,246,.75) 60%,rgba(250,249,246,0));z-index:-1}
.cap .line{display:block;font-size:92px;line-height:1.08;clip-path:inset(0 0 0 100%)}
.cap .lat{font-family:Josefin;font-weight:700;font-size:.92em}
.pill{display:inline-block;background:#8bc53f;color:#141414;border-radius:999px;font-size:52px;padding:10px 34px 0;margin-bottom:22px;transform:scale(0)}
.cap svg{display:block;margin:18px auto 0;width:520px;height:30px;overflow:visible}
.cap svg path{fill:none;stroke:#141414;stroke-width:5;stroke-linecap:round}
.list{position:absolute;top:220px;right:70px;left:70px;opacity:0}
.list .glow{position:absolute;inset:-60px -50px;background:radial-gradient(closest-side,rgba(250,249,246,.95),rgba(250,249,246,.82) 65%,rgba(250,249,246,0));z-index:-1}
.list h2{margin:0 0 26px;font-size:78px;line-height:1.05;text-align:center;font-weight:400}
.list .row{display:flex;gap:22px;align-items:center;font-size:50px;line-height:1.1;margin:0 0 20px;opacity:0;transform:translateX(-40px)}
.list .n{flex:none;width:72px;height:72px;border-radius:50%;background:#7a3fd1;color:#fff;display:grid;place-items:center;font-size:44px;padding-top:6px;box-sizing:border-box}
.tag{position:absolute;left:90px;top:300px;width:auto;white-space:nowrap;background:#fff;border:5px solid #141414;border-radius:28px;padding:30px 40px 22px;box-shadow:14px 14px 0 rgba(20,20,20,.12);transform-origin:50% 100%;opacity:0}
.tag b{display:block;font-size:84px;line-height:1;font-weight:400}
.tag > span{display:block;font-size:46px;margin-top:10px}
.tag i{position:absolute;left:52%;bottom:-150px;width:5px;height:150px;background:#141414;transform:rotate(-42deg);transform-origin:top;border-radius:3px}
.end{position:absolute;inset:0;background:#faf9f6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:70px;opacity:0}
.end .paper{position:absolute;inset:0;background:repeating-linear-gradient(-12deg,rgba(0,0,0,.018) 0 2px,transparent 2px 7px)}
.end img.logo{width:620px;position:relative}
.end .cta{font-size:104px;line-height:1.08;text-align:center;position:relative}
.end img.lvl{width:760px;position:relative}
.end img.duo{width:560px;position:relative;margin-top:-20px}

.intro{position:absolute;inset:0;opacity:0}
.slide{position:absolute;top:560px;right:70px;left:70px;text-align:center}
.slide .w{display:inline-block;transform:scale(0);opacity:0}
.slide .big{font-size:150px;line-height:1.02}
.slide .mid{font-size:112px;line-height:1.08}
.slide .sm{font-size:84px;line-height:1.1}
.slide svg{position:absolute;overflow:visible}
.slide svg path{fill:none;stroke:#7a3fd1;stroke-width:9;stroke-linecap:round}
.slide img.logo{width:700px;display:block;margin:46px auto 0;transform:scale(0)}
.ifly{position:absolute;width:300px;top:0;left:0}
.imag{position:absolute;width:560px;left:260px;top:1080px}
.iduo{position:absolute;width:820px;left:130px;top:1130px}
.ipeek{position:absolute;width:640px;left:220px;bottom:-40px}
.lat2{font-family:Josefin;font-weight:700}
</style></head><body>
<div id="caps"></div>
<div class="intro" id="intro">
 <div class="slide" id="sl1"><div class="big"><span class="w">מפתחות</span> <span class="w">ומפתחי</span><br><span class="w" id="hl1">למידה?</span></div>
   <svg id="circ" style="left:0;top:0" width="10" height="10"><path d=""/></svg></div>
 <div class="slide" id="sl2"><div class="mid"><span class="w">רוצים</span> <span class="w">להפוך</span> <span class="w">את</span><br><span class="w lat2">Claude</span> <span class="w">לשותף</span><br><span class="w">בעבודה</span> <span class="w">שלכם?</span></div></div>
 <div class="slide" id="sl3"><div class="mid"><span class="w">סדנה</span> <span class="w">בת</span> <span class="w">4</span> <span class="w">מפגשים</span></div><div class="sm"><span class="w">מבית</span></div><img class="logo" id="ilogo" src="../../assets/img/logo-black.png"></div>
 <img class="ifly" id="ifly" src="../../assets/img/fly-wide.webp">
 <img class="imag" id="imag" src="../../assets/img/fly-magnify.webp">
 <img class="iduo" id="iduo" src="../../assets/img/duo-highfive.webp">
 <img class="ipeek" id="ipeek" src="../../assets/img/claude-peek.webp">
</div>
<div class="list" id="list"><div class="glow"></div>
  <h2>סדנה בת ארבעה מפגשים:<br>ללמוד לעבוד יחד עם <span style="font-family:Josefin;font-weight:700">Claude</span></h2>
  <div class="row"><span class="n">1</span><span>מי זה <span class="lat" style="font-family:Josefin;font-weight:700">Claude</span>? היכרות ומודלים</span></div>
  <div class="row"><span class="n">2</span><span><span style="font-family:Josefin;font-weight:700">Skills</span>: שיטת העבודה שלכם</span></div>
  <div class="row"><span class="n">3</span><span>לומדה בשיטת <span style="font-family:Josefin;font-weight:700">vibe coding</span></span></div>
  <div class="row"><span class="n">4</span><span>הפקות וידאו: יום באולפן</span></div>
</div>
<div class="tag" id="tag"><b>שחר עזר</b><span>מוביל בינה מלאכותית <span style="font-family:Josefin;font-weight:700">Lnet</span></span><i></i></div>
<div class="end" id="end"><div class="paper"></div>
  <img class="logo" src="../../assets/img/logo-black.png">
  <div class="cta">לפרטים נוספים:<br>קישור בפוסט</div>
  <img class="lvl" src="../../assets/img/level-up.webp">
</div>
<script>
const L=s=>s.replace(/(Claude|Skills|vibe coding|Gada-Lnet|Lnet)/g,'<span class="lat">$1</span>');
const clamp=x=>Math.max(0,Math.min(1,x)), ease=x=>1-Math.pow(1-clamp(x),3), back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let CFG=null, capEls=[];
function setup(cfg){CFG=cfg;const box=document.getElementById('caps');
  cfg.caps.forEach(c=>{const d=document.createElement('div');d.className='cap';
    d.innerHTML='<div class="glow"></div>'+(c.pill?'<span class="pill">'+c.pill+'</span>':'')+c.lines.map(l=>'<span class="line">'+L(l)+'</span>').join('')+'<svg viewBox="0 0 520 30"><path d="M8 18 C 120 6, 250 28, 380 14 S 500 12, 512 16"/></svg>';
    box.appendChild(d);const p=d.querySelector('path');const len=p.getTotalLength();p.style.strokeDasharray=len;p.dataset.len=len;capEls.push([c,d,p]);});
}


function renderIntro(t){const I=CFG.intro, el=document.getElementById('intro'); if(!I){el.style.opacity=0;return}
  if(t<0||t>I.out){el.style.opacity=0;return} el.style.opacity=Math.min(1,clamp((I.out-t)/.3));
  const sl=[['sl1',0,I.s2],['sl2',I.s2,I.s3],['sl3',I.s3,I.out+1]];
  sl.forEach(([id,a,b])=>{const e=document.getElementById(id); const on=t>=a&&t<b; e.style.display=on?'block':'none'; if(!on)return;
    const out=clamp((b-t)/.22); e.style.opacity=out; e.style.transform='translateY('+(-40*(1-out))+'px)';
    e.querySelectorAll('.w').forEach((w,i)=>{const k=back((t-a-.1-i*.14)/.35);w.style.transform='scale('+Math.max(0,k)+')';w.style.opacity=clamp((t-a-.1-i*.14)/.12)});
    const lg=e.querySelector('.logo'); if(lg){const k=back((t-a-.9)/.45);lg.style.transform='scale('+Math.max(0,k)+')'}
    const c=e.querySelector('#circ path'); if(c){ if(!c.dataset.ok){const w=document.getElementById('hl1'), sv=e.querySelector('#circ'), pr=e.getBoundingClientRect(), r=w.getBoundingClientRect();
        const cx=r.left-pr.left+r.width/2, cy=r.top-pr.top+r.height/2+6, rx=r.width/2+70, ry=r.height/2+28; sv.setAttribute('width',e.clientWidth); sv.setAttribute('height',900);
        let d=''; for(let k=0;k<=72;k++){const th=-Math.PI*0.62+k/64*2*Math.PI; const j=1+0.035*Math.sin(k*0.4); d+=(k?'L':'M')+(cx+rx*j*Math.cos(th)).toFixed(1)+' '+(cy+ry*j*Math.sin(th)).toFixed(1)+' ';}
        c.setAttribute('d',d); c.dataset.ok=1;}
      const L=c.getTotalLength();c.style.strokeDasharray=L;c.style.strokeDashoffset=L*(1-ease((t-a-.7)/.6))}});
  const mg=document.getElementById('imag'); const mi=back((t-.5)/.6), mo=clamp((I.s2-t)/.25); mg.style.transform='translateY('+((1-Math.min(1,mi))*700)+'px) rotate('+(Math.sin(t*3)*4)+'deg)'; mg.style.opacity=t<I.s2?mo:0;
  const du=document.getElementById('iduo'); const di=back((t-I.s3-.6)/.6); du.style.transform='translateY('+((1-Math.min(1,Math.max(0,di)))*800)+'px)'; du.style.opacity=t>=I.s3?1:0;
  // butterfly flutters in from the right and hovers near the headline
  const f=document.getElementById('ifly'); const u=ease((t-.3)/1.1); const bob=Math.sin(t*7)*14;
  const fx=1120-u*(1120-740), fy=170+Math.sin(u*Math.PI)*-90+bob; f.style.transform='translate('+fx+'px,'+fy+'px) rotate('+(-8+Math.sin(t*9)*6)+'deg) scaleX('+(1+Math.sin(t*22)*0.06)+')';
  f.style.opacity=0;
  // Claude peeks from the bottom while the question is asked
  const p=document.getElementById('ipeek'); const pin=back((t-I.s2-.2)/.6), pout=clamp((I.s3+.2-t)/.35);
  p.style.transform='translateY('+(1-Math.min(pin,1)*pout)*560+'px) rotate(-3deg)';
}

function render(t){renderIntro(t);
  capEls.forEach(([c,d,p])=>{const a=t-c.in, b=c.out-t;
    if(a<0||b<0){d.style.opacity=0;return}
    d.style.opacity=Math.min(1,clamp(b/.3));d.style.transform='translateY('+(-30*(1-clamp(b/.3)))+'px)';
    const pill=d.querySelector('.pill'); if(pill)pill.style.transform='scale('+back(a/.35)+')';
    const off=pill?.25:0;
    d.querySelectorAll('.line').forEach((l,i)=>{const k=ease((a-off-i*.28)/.55);l.style.clipPath='inset(0 0 0 '+(100-100*k)+'%)'});
    const n=d.querySelectorAll('.line').length; const k=ease((a-off-n*.28-.2)/.5); p.style.strokeDashoffset=p.dataset.len*(1-k);
  });
  const li=CFG.list, le=document.getElementById('list');
  if(li&&t>=li.in&&t<=li.out){const a=t-li.in,b=li.out-t;le.style.opacity=Math.min(clamp(a/.3),clamp(b/.3));
    le.querySelectorAll('.row').forEach((r,i)=>{const k=ease((a-.6-i*.45)/.4);r.style.opacity=k;r.style.transform='translateX('+(-40*(1-k))+'px)'});
  } else le.style.opacity=0;
  const tg=CFG.tag, te=document.getElementById('tag');
  if(tg&&t>=tg.in&&t<=tg.out){const a=t-tg.in,b=tg.out-t;te.style.opacity=Math.min(clamp(a/.2),clamp(b/.25));te.style.transform='rotate(-3deg) scale('+back(a/.45)+')'} else te.style.opacity=0;
  const en=CFG.end, ee=document.getElementById('end');
  if(en&&t>=en.in){const a=t-en.in;ee.style.opacity=clamp(a/.35);
    [...ee.children].slice(1).forEach((c,i)=>{const k=back((a-.25-i*.22)/.45);c.style.transform='scale('+Math.max(0,k)+')'})} else ee.style.opacity=0;
}
</script></body></html>
