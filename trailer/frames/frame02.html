<!doctype html><html lang="he"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body{background:var(--pink)}
  .kicker{font-size:104px;font-weight:900;color:var(--paper);
    text-shadow:6px 6px 0 var(--ink);margin-bottom:14px;letter-spacing:-.01em}
  .title{font-size:270px;line-height:.92;font-weight:900;color:var(--ink);
    display:flex;align-items:center;gap:28px}
  .figmabox{background:var(--lav);border:7px solid var(--ink);
    box-shadow:16px 16px 0 var(--lime);padding:.02em .22em;transform:rotate(-2deg)}
  .sub{margin-top:38px;font-size:60px;font-weight:800;color:var(--ink);
    background:var(--paper);border:6px solid var(--ink);border-radius:999px;
    padding:.18em .85em;box-shadow:9px 9px 0 var(--ink)}
</style></head>
<body><div class="stage">

  <!-- floating topic stickers -->
  <div class="tag" style="left:120px;top:130px;background:var(--lime);transform:rotate(-9deg)"><span class="latin">Wireframes</span></div>
  <div class="tag dash" style="left:1430px;top:120px;background:var(--cyan);transform:rotate(8deg)"><span class="latin">Components</span></div>
  <div class="tag" style="left:90px;top:470px;background:var(--yellow);transform:rotate(6deg)"><span class="latin">Auto Layout</span></div>
  <div class="tag" style="left:1480px;top:470px;background:var(--orange);transform:rotate(-7deg)"><span class="latin">Prototyping</span></div>
  <div class="tag dash" style="left:150px;top:860px;background:var(--lav);transform:rotate(5deg)"><span class="latin">FigJam</span></div>
  <div class="tag" style="left:760px;top:905px;background:var(--blue);color:#fff;transform:rotate(-3deg)"><span class="latin">High&#8209;Fidelity</span></div>
  <div class="tag" style="left:1430px;top:880px;background:var(--lime);transform:rotate(9deg)"><span class="latin">Plugins</span></div>

  <!-- config doodle stickers -->
  <svg class="sticker" style="left:330px;top:250px;width:120px" viewBox="0 0 100 100"><path d="M20 80 L52 16 L72 40 Z" fill="var(--lime)" stroke="#111" stroke-width="4"/><circle cx="52" cy="64" r="6" fill="#111"/></svg>
  <svg class="sticker" style="left:1450px;top:660px;width:120px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#cfd8d4" stroke="#111" stroke-width="3"/><g fill="#111"><rect x="34" y="42" width="9" height="9"/><rect x="58" y="42" width="9" height="9"/><rect x="36" y="60" width="30" height="8"/></g></svg>

  <div class="center">
    <div class="kicker">הכירו את קורס</div>
    <div class="title">
      <span class="figmabox latin">FIGMA</span>
    </div>
    <div class="sub">קמפוס IL&nbsp;·&nbsp;האצה להייטק — מסלול <span class="latin">Design</span></div>
  </div>
</div></body></html>
