<!doctype html><html lang="he"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body{background:var(--lime)}
  .big{font-size:230px;line-height:.9;font-weight:900;color:var(--ink)}
  .big em{font-style:normal;background:var(--pink);color:var(--paper);
    padding:.01em .16em;box-shadow:14px 14px 0 var(--ink);display:inline-block;
    transform:rotate(-2deg)}
  .cta{margin-top:60px;font-size:72px;font-weight:800;color:var(--paper);
    background:var(--ink);border-radius:999px;padding:.28em 1.1em;
    box-shadow:12px 12px 0 rgba(0,0,0,.25)}
  .cta .latin{color:var(--lime)}
  .foot{position:absolute;left:0;right:0;bottom:48px;display:flex;
    align-items:center;justify-content:center;gap:18px;font-size:48px;
    font-weight:800;color:var(--ink)}
</style></head>
<body><div class="stage">

  <svg class="sticker" style="left:170px;top:170px;width:150px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#cfd8d4" stroke="#111" stroke-width="3"/><g fill="#111"><rect x="34" y="42" width="9" height="9"/><rect x="58" y="42" width="9" height="9"/><rect x="34" y="60" width="32" height="9"/></g></svg>
  <svg class="sticker" style="left:1560px;top:160px;width:150px" viewBox="0 0 100 100"><polygon points="50,8 92,50 50,92 8,50" fill="var(--blue)" stroke="#111" stroke-width="4"/><polygon points="50,30 70,50 50,70 30,50" fill="var(--yellow)"/></svg>
  <svg class="sticker" style="left:160px;top:730px;width:140px" viewBox="0 0 100 100"><path d="M20 80 L52 16 L72 40 Z" fill="var(--orange)" stroke="#111" stroke-width="4"/><circle cx="52" cy="64" r="6" fill="#111"/></svg>
  <div class="tag dash" style="left:1500px;top:740px;background:var(--cyan);transform:rotate(7deg)"><span class="latin">Free</span></div>

  <div class="center">
    <div class="big">הופכים רעיונות<br><em>למציאות.</em></div>
    <div class="cta">מתחילים לעצב עכשיו · <span class="latin">קמפוס IL</span></div>
  </div>
  <div class="foot"><span>בעברית</span><span>•</span><span>בחינם</span><span>•</span><span class="latin">app.campus.gov.il</span></div>
</div></body></html>
