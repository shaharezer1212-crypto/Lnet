<!doctype html><html lang="he"><head><meta charset="utf-8">
<link rel="stylesheet" href="../frames/base.css">
<style>
  html,body{background:transparent}            /* fully transparent overlay; living bg is a separate ffmpeg layer */
  @keyframes winpop{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
  @keyframes drop{0%{opacity:0;transform:translateY(-40px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes pop{0%{opacity:0;transform:scale(.2) rotate(var(--r,0deg))}65%{opacity:1;transform:scale(1.08) rotate(var(--r,0deg))}100%{opacity:1;transform:scale(1) rotate(var(--r,0deg))}}
  @keyframes breathe{0%,100%{transform:scale(1) rotate(var(--r,0deg))}50%{transform:scale(1.09) rotate(var(--r,0deg))}}
  @keyframes fl{0%,100%{translate:0 0}50%{translate:0 -12px}}

  .window{position:absolute;left:370px;top:200px;width:1180px;height:741px;
    border:6px solid var(--ink);border-radius:22px;box-shadow:16px 16px 0 rgba(0,0,0,.2);overflow:hidden;
    transform-origin:center;animation:winpop .55s cubic-bezier(.2,1.4,.4,1) .15s both}
  .bar{height:72px;background:#f3f3f3;border-bottom:4px solid var(--ink);display:flex;align-items:center;gap:14px;padding:0 24px}
  .dot{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink)}
  .hole{height:657px;background:transparent}
  .head{position:absolute;left:0;right:0;top:58px;text-align:center;font-size:60px;font-weight:900;color:var(--ink);
    text-shadow:4px 4px 0 var(--paper);opacity:0;animation:drop .55s cubic-bezier(.2,1.4,.4,1) .1s both}

  .tag.feat{position:absolute;font-size:38px;opacity:0;
    animation:pop .55s cubic-bezier(.2,1.6,.4,1) var(--d,0s) both, fl 3s ease-in-out var(--d,0s) infinite}
  .ico{position:absolute;filter:drop-shadow(7px 7px 0 rgba(0,0,0,.16));opacity:0;
    animation:pop .5s cubic-bezier(.2,1.6,.4,1) var(--d,0s) both, breathe 2.4s ease-in-out var(--d,0s) infinite}
</style></head>
<body>
<div class="content"><div class="stage">
  <div class="head">סרטוני למידה · הדרכות מעשיות · תרגולים</div>

  <!-- feature words (narration: בקצב שלכם, מכל מקום, בעברית, ובחינם) -->
  <div class="tag feat" style="--r:-7deg;--d:.5s;left:60px;top:300px;background:var(--lime)">בקצב שלכם</div>
  <div class="tag feat" style="--r:7deg;--d:1.2s;right:60px;top:300px;background:var(--yellow)">מכל מקום</div>
  <div class="tag feat dash" style="--r:6deg;--d:1.9s;left:70px;top:560px;background:var(--lav)">בעברית</div>
  <div class="tag feat" style="--r:-6deg;--d:2.6s;right:60px;top:560px;background:var(--orange)">ובחינם</div>

  <!-- living, breathing Config icons -->
  <svg class="ico" style="--r:-8deg;--d:1.0s;left:150px;top:440px;width:120px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="var(--cyan)" stroke="#111" stroke-width="5"/><path d="M50 26 V52 L68 62" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/></svg>
  <svg class="ico" style="--r:8deg;--d:1.6s;right:160px;top:450px;width:120px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="var(--pink)" stroke="#111" stroke-width="5"/><path d="M30 52 L45 66 L72 36" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <svg class="ico" style="--r:6deg;--d:2.2s;left:130px;top:820px;width:110px" viewBox="0 0 100 100"><polygon points="50,8 92,50 50,92 8,50" fill="var(--blue)" stroke="#111" stroke-width="5"/><polygon points="50,30 70,50 50,70 30,50" fill="var(--yellow)"/></svg>
  <svg class="ico" style="--r:-6deg;--d:2.8s;right:140px;top:820px;width:110px" viewBox="0 0 100 100"><path d="M50 86 C16 62 10 36 30 24 C44 16 50 30 50 36 C50 30 56 16 70 24 C90 36 84 62 50 86Z" fill="var(--lime)" stroke="#111" stroke-width="5"/></svg>

  <div class="window">
    <div class="bar"><span class="dot" style="background:var(--pink)"></span><span class="dot" style="background:var(--yellow)"></span><span class="dot" style="background:var(--lime)"></span>
      <span style="margin-inline-start:auto;font-weight:800;font-size:24px" class="latin">Figma · קמפוס IL</span></div>
    <div class="hole"></div>
  </div>
</div></div>
<div class="trans in"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="trans out" style="--t0:8.9s"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</body></html>
