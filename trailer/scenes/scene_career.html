<!doctype html><html lang="he"><head><meta charset="utf-8">
<link rel="stylesheet" href="../frames/base.css">
<style>
  body{background:var(--bg)}
  @keyframes drop{0%{opacity:0;transform:translateY(-60px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes stamp{0%{opacity:0;transform:scale(1.6) rotate(-2deg)}60%{opacity:1;transform:scale(.95) rotate(-2deg)}100%{opacity:1;transform:scale(1) rotate(-2deg)}}
  @keyframes pop{0%{opacity:0;transform:scale(.2) rotate(var(--r,0deg))}65%{opacity:1;transform:scale(1.08) rotate(var(--r,0deg))}100%{opacity:1;transform:scale(1) rotate(var(--r,0deg))}}
  @keyframes fl{0%,100%{translate:0 0}50%{translate:0 -12px}}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .l1{font-size:150px;line-height:.95;font-weight:900;color:var(--ink);text-align:center;
    opacity:0;animation:drop .6s cubic-bezier(.2,1.4,.4,1) .2s both}
  .l1 em{font-style:normal;display:inline-block;background:var(--lime);padding:.02em .16em;
    box-shadow:12px 12px 0 var(--ink);opacity:0;transform:rotate(-2deg);
    animation:stamp .55s cubic-bezier(.2,1.5,.4,1) .9s both}
  .sub{margin-top:46px;font-size:58px;font-weight:800;color:var(--ink);
    background:var(--paper);border:6px solid var(--ink);border-radius:999px;padding:.2em .9em;
    box-shadow:9px 9px 0 var(--ink);opacity:0;animation:drop .55s ease 1.5s both}
  .tag.role{position:absolute;font-size:40px;
    opacity:0;animation:pop .55s cubic-bezier(.2,1.6,.4,1) var(--d,0s) both, fl 3s ease-in-out var(--d,0s) infinite}
  .st{position:absolute;filter:drop-shadow(8px 8px 0 rgba(0,0,0,.16));animation:fl 3s ease-in-out infinite}
</style></head>
<body>
<div class="livingbg"><b></b><b></b><b></b><b></b><b></b></div>
<div class="content"><div class="stage">
  <svg class="st" style="left:160px;top:200px;width:120px" viewBox="0 0 100 100"><polygon points="50,8 92,50 50,92 8,50" fill="var(--blue)" stroke="#111" stroke-width="4"/><polygon points="50,30 70,50 50,70 30,50" fill="var(--yellow)"/></svg>
  <svg class="st" style="right:170px;bottom:210px;width:120px;animation-delay:.5s" viewBox="0 0 100 100"><path d="M50 6 L60 40 L96 50 L60 60 L50 94 L40 60 L4 50 L40 40 Z" fill="var(--pink)" stroke="#111" stroke-width="4"/></svg>

  <div class="tag role" style="--r:-7deg;--d:1.9s;left:120px;top:300px;background:var(--cyan)"><span class="latin">UI / UX Designer</span></div>
  <div class="tag role" style="--r:7deg;--d:2.2s;right:110px;top:300px;background:var(--orange)"><span class="latin">Product Designer</span></div>
  <div class="tag role" style="--r:5deg;--d:2.5s;left:160px;bottom:280px;background:var(--lav)"><span class="latin">Web Designer</span></div>
  <div class="tag role" style="--r:-6deg;--d:2.8s;right:150px;bottom:290px;background:var(--lime)"><span class="latin">Design Systems</span></div>

  <div class="wrap">
    <div class="l1">רוצים להשתלב<br><em>בהייטק?</em></div>
    <div class="sub">עיצוב מוצר — אחד התפקידים המבוקשים</div>
  </div>
</div></div>
</body></html>
