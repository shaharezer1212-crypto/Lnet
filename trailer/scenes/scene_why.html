<!doctype html><html lang="he"><head><meta charset="utf-8">
<link rel="stylesheet" href="../frames/base.css">
<style>
  body{background:var(--bg)}
  .title{position:absolute;left:0;right:0;top:90px;text-align:center;
    font-size:104px;font-weight:900;color:var(--ink);text-shadow:5px 5px 0 var(--paper);
    opacity:0;transform:translateY(-50px);animation:drop .6s cubic-bezier(.2,1.4,.4,1) .2s both}
  .title em{font-style:normal;background:var(--lime);padding:.02em .14em;box-shadow:8px 8px 0 var(--ink)}
  @keyframes drop{to{opacity:1;transform:translateY(0)}}

  .figwin{position:absolute;left:50%;top:600px;transform:translate(-50%,-50%);
    width:1340px;height:640px;border:6px solid var(--ink);border-radius:16px;overflow:hidden;
    background:#2b2b2b;box-shadow:18px 18px 0 rgba(0,0,0,.2);
    opacity:0;animation:winpop .6s cubic-bezier(.2,1.45,.4,1) .7s both}
  @keyframes winpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.85)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  .ftop{height:54px;background:#1d1d1d;display:flex;align-items:center;gap:14px;padding:0 18px;color:#bbb;font-weight:700;font-size:20px}
  .fdot{width:22px;height:22px;border-radius:6px;background:var(--lime)}
  .fbody{display:flex;height:586px}
  .fpanel{width:250px;background:#2b2b2b;color:#cfcfcf;font-size:18px;padding:14px}
  .fpanel.r{border-left:2px solid #000}.fpanel.l{border-right:2px solid #000}
  .row{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:6px}
  .row.sel{background:#3a6df0;color:#fff}
  .sw{width:18px;height:18px;border-radius:4px;border:1px solid #000}
  .fcanvas{flex:1;background:#1a1a1a;position:relative;
    background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:26px 26px}
  .art{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:560px;height:430px;
    background:#fff;border-radius:10px;overflow:hidden;border:2px solid #000}
  .a-bar{height:42px;background:#f3f3f3;border-bottom:3px solid #111;display:flex;align-items:center;padding:0 14px;gap:8px}
  .a-d{width:12px;height:12px;border-radius:50%;border:2px solid #111}
  .a-hero{padding:20px}.a-h1{font-weight:900;font-size:38px;color:#111;line-height:.95}
  .a-btn{display:inline-block;margin-top:10px;background:var(--lime);border:3px solid #111;border-radius:999px;font-weight:800;font-size:20px;padding:.25em .9em}
  .a-cards{display:flex;gap:12px;padding:0 20px}.a-card{flex:1;height:90px;border:3px solid #111;border-radius:10px}
  .selbox{position:absolute;left:18px;top:60px;right:18px;height:120px;border:3px solid #3a6df0;
    animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(58,109,240,.0)}50%{box-shadow:0 0 0 6px rgba(58,109,240,.25)}}
  .cursor{position:absolute;width:40px;height:40px;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.4));
    animation:move 4s ease-in-out infinite}
  @keyframes move{0%{left:54%;top:40%}50%{left:42%;top:62%}100%{left:54%;top:40%}}
  .st{position:absolute;filter:drop-shadow(8px 8px 0 rgba(0,0,0,.16));animation:fl 3s ease-in-out infinite}
  @keyframes fl{0%,100%{translate:0 0}50%{translate:0 -12px}}
</style></head>
<body>
<div class="livingbg"><b></b><b></b><b></b><b></b><b></b></div>
<div class="content"><div class="stage">
  <svg class="st" style="left:90px;top:330px;width:120px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="var(--orange)" stroke="#111" stroke-width="4"/><rect x="32" y="32" width="36" height="36" fill="var(--paper)" transform="rotate(45 50 50)"/></svg>
  <svg class="st" style="right:90px;top:340px;width:120px;animation-delay:.5s" viewBox="0 0 100 100"><path d="M50 12 C70 12 88 30 88 50 C88 78 50 92 50 92 C50 92 12 78 12 50 C12 30 30 12 50 12Z" fill="var(--cyan)" stroke="#111" stroke-width="4"/></svg>
  <svg class="st" style="left:130px;top:560px;width:96px;animation-delay:.9s" viewBox="0 0 100 100"><path d="M50 6 L60 40 L96 50 L60 60 L50 94 L40 60 L4 50 L40 40 Z" fill="var(--lime)" stroke="#111" stroke-width="4"/></svg>
  <svg class="st" style="right:120px;top:580px;width:100px;animation-delay:.4s" viewBox="0 0 100 100"><polygon points="50,8 92,50 50,92 8,50" fill="var(--yellow)" stroke="#111" stroke-width="4"/><polygon points="50,30 70,50 50,70 30,50" fill="var(--ink)"/></svg>
  <svg class="st" style="left:100px;top:820px;width:90px;animation-delay:1.1s" viewBox="0 0 100 100"><path d="M20 80 L52 16 L72 40 Z" fill="var(--pink)" stroke="#111" stroke-width="4"/></svg>

  <div class="title">הכלי ש<em>כולם</em> משתמשים בו</div>

  <div class="figwin">
    <div class="ftop"><span class="fdot"></span><span class="latin">Figma</span><span style="opacity:.6">›</span><span>STUDIO — Web</span></div>
    <div class="fbody">
      <div class="fpanel l">
        <div style="opacity:.6;margin-bottom:6px">Layers</div>
        <div class="row sel">▸ Hero</div>
        <div class="row">▸ Navbar</div>
        <div class="row">▸ Cards</div>
        <div class="row">▸ Footer</div>
        <div class="row">▸ Button</div>
      </div>
      <div class="fcanvas">
        <div class="art">
          <div class="a-bar"><span class="a-d" style="background:var(--pink)"></span><span class="a-d" style="background:var(--yellow)"></span><span class="a-d" style="background:var(--lime)"></span></div>
          <div class="a-hero"><div class="a-h1">רעיונות<br>למוצר.</div><span class="a-btn">בואו נתחיל</span></div>
          <div class="a-cards"><div class="a-card" style="background:var(--lav)"></div><div class="a-card" style="background:var(--cyan)"></div><div class="a-card" style="background:var(--orange)"></div></div>
          <div class="selbox"></div>
        </div>
        <svg class="cursor" viewBox="0 0 24 24"><path d="M3 2 L20 11 L12 13 L9 21 Z" fill="#fff" stroke="#111" stroke-width="1.6"/></svg>
      </div>
      <div class="fpanel r">
        <div style="opacity:.6;margin-bottom:6px">Design</div>
        <div class="row">Fill <span class="sw" style="background:var(--lav);margin-inline-start:auto"></span></div>
        <div class="row">Stroke <span class="sw" style="background:#111;margin-inline-start:auto"></span></div>
        <div class="row">Radius <span style="margin-inline-start:auto">16</span></div>
        <div class="row">Auto layout <span style="margin-inline-start:auto">↕ ↔</span></div>
      </div>
    </div>
  </div>
</div></div>
<div class="trans in"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="trans out" style="--t0:7.4s"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</body></html>
