<!doctype html><html lang="he"><head><meta charset="utf-8">
<link rel="stylesheet" href="../frames/base.css">
<style>
  body{background:var(--bg)}
  .kicker{position:absolute;left:0;right:0;top:170px;text-align:center;
    font-size:90px;font-weight:900;color:var(--ink);text-shadow:5px 5px 0 var(--paper);
    opacity:0;transform:translateY(-50px);animation:drop .6s cubic-bezier(.2,1.4,.4,1) .15s both}
  @keyframes drop{to{opacity:1;transform:translateY(0)}}
  .cluster{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);
    width:1480px;display:flex;flex-wrap:wrap;gap:32px 40px;align-items:center;justify-content:center}
  .big{position:relative;font-size:58px;padding:.3em 1em;box-shadow:9px 9px 0 var(--ink);border-width:5px;
    opacity:0;transform:scale(.2) rotate(var(--r,0deg));
    animation:pop .6s cubic-bezier(.2,1.6,.4,1) var(--d,0s) both, fl 3s ease-in-out var(--d,0s) infinite}
  @keyframes pop{to{opacity:1;transform:scale(1) rotate(var(--r,0deg))}}
  @keyframes fl{0%,100%{translate:0 0}50%{translate:0 -10px}}
  .st{position:absolute;filter:drop-shadow(8px 8px 0 rgba(0,0,0,.16));animation:fl 3s ease-in-out infinite}
</style></head>
<body>
<div class="livingbg"><b></b><b></b><b></b><b></b><b></b></div>
<div class="content"><div class="stage">
  <svg class="st" style="left:150px;top:200px;width:120px" viewBox="0 0 100 100"><path d="M20 80 L52 16 L72 40 Z" fill="var(--lime)" stroke="#111" stroke-width="4"/><circle cx="52" cy="64" r="6" fill="#111"/></svg>
  <svg class="st" style="right:160px;bottom:190px;width:120px" viewBox="0 0 100 100"><polygon points="50,8 92,50 50,92 8,50" fill="var(--blue)" stroke="#111" stroke-width="4"/><polygon points="50,30 70,50 50,70 30,50" fill="var(--yellow)"/></svg>

  <div class="kicker">בקורס תלמדו:</div>
  <div class="cluster">
    <div class="tag big" style="--r:-4deg;--d:0.6s;background:var(--lime)"><span class="latin">Wireframes</span></div>
    <div class="tag big" style="--r:3deg;--d:1.9s;background:var(--cyan)"><span class="latin">Components</span></div>
    <div class="tag big" style="--r:-3deg;--d:2.8s;background:var(--yellow)"><span class="latin">Auto Layout</span></div>
    <div class="tag big" style="--r:4deg;--d:4.2s;background:var(--orange)"><span class="latin">High-Fidelity</span></div>
    <div class="tag big" style="--r:-3deg;--d:5.6s;background:var(--lav)"><span class="latin">Prototyping</span></div>
    <div class="tag big" style="--r:3deg;--d:7.4s;background:var(--blue);color:#fff"><span class="latin">Figma → Web</span></div>
  </div>
</div></div>
<div class="trans in"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="trans out" style="--t0:9.8s"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</body></html>
