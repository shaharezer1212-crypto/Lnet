<!doctype html><html lang="he"><head><meta charset="utf-8">
<link rel="stylesheet" href="../frames/base.css">
<style>
  body{background:var(--bg)}
  @keyframes show{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}82%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.12)}}
  @keyframes popin{0%{opacity:0;transform:scale(.2) rotate(var(--r,0deg))}65%{opacity:1;transform:scale(1.08) rotate(var(--r,0deg))}100%{opacity:1;transform:scale(1) rotate(var(--r,0deg))}}
  @keyframes popinC{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}65%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  @keyframes capshow{0%{opacity:0;transform:translateY(26px)}12%{opacity:1;transform:translateY(0)}86%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-12px)}}
  @keyframes fl{0%,100%{translate:0 0}50%{translate:0 -12px}}
  @keyframes emofade{to{opacity:0}}

  /* device frames, centred, cross-faded */
  .dev{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
    background:var(--paper);border:6px solid var(--ink);box-shadow:16px 18px 0 rgba(0,0,0,.18);overflow:hidden}
  .desktop{width:980px;height:600px;border-radius:18px}
  .tablet{width:520px;height:680px;border-radius:24px}
  .phone{width:330px;height:680px;border-radius:38px}
  /* mini site (same brand, different layout) */
  .bar{height:60px;background:#f4f4f4;border-bottom:4px solid var(--ink);display:flex;align-items:center;gap:10px;padding:0 18px}
  .bdot{width:15px;height:15px;border-radius:50%;border:2px solid var(--ink)}
  .brand{margin-inline-start:auto;font-weight:900;font-size:22px}
  .hero{padding:26px 26px 0;direction:rtl}
  .h1{font-weight:900;line-height:.95;color:var(--ink)}
  .btn{display:inline-block;margin-top:14px;background:var(--lime);border:4px solid var(--ink);
    border-radius:999px;font-weight:800;padding:.3em 1em;box-shadow:5px 5px 0 var(--ink)}
  .cards{display:flex;gap:14px;padding:22px 26px;flex-wrap:wrap}
  .card{flex:1;min-width:90px;height:120px;border:4px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink)}
  .stack .cards{flex-direction:column}.stack .card{height:84px;width:100%}

  .icon{position:absolute;filter:drop-shadow(8px 8px 0 rgba(0,0,0,.16))}
  .cap{position:absolute;left:60px;right:60px;bottom:60px;text-align:center;color:var(--ink);
    font-weight:900;font-size:78px;line-height:1.04;text-shadow:4px 4px 0 var(--paper);opacity:0}
</style></head>
<body>
<div class="livingbg"><b></b><b></b><b></b><b></b><b></b></div>
<div class="content"><div class="stage">

  <!-- DESKTOP -->
  <div class="dev desktop" style="animation:show 3.6s ease 0s both">
    <div class="bar"><span class="bdot" style="background:var(--pink)"></span><span class="bdot" style="background:var(--yellow)"></span><span class="bdot" style="background:var(--lime)"></span><span class="brand latin">STUDIO</span></div>
    <div class="hero"><div class="h1" style="font-size:54px">רעיונות שהופכים<br>למוצר.</div><span class="btn">בואו נתחיל</span></div>
    <div class="cards"><div class="card" style="background:var(--lav)"></div><div class="card" style="background:var(--cyan)"></div><div class="card" style="background:var(--orange)"></div></div>
  </div>
  <!-- TABLET -->
  <div class="dev tablet stack" style="animation:show 3.4s ease 3.4s both">
    <div class="bar"><span class="bdot" style="background:var(--pink)"></span><span class="bdot" style="background:var(--yellow)"></span><span class="brand latin">STUDIO</span></div>
    <div class="hero"><div class="h1" style="font-size:44px">רעיונות שהופכים למוצר.</div><span class="btn">בואו נתחיל</span></div>
    <div class="cards"><div class="card" style="background:var(--lav)"></div><div class="card" style="background:var(--cyan)"></div></div>
  </div>
  <!-- PHONE -->
  <div class="dev phone stack" style="animation:show 3.2s ease 6.4s both">
    <div class="bar"><span class="bdot" style="background:var(--pink)"></span><span class="brand latin" style="font-size:18px">STUDIO</span></div>
    <div class="hero" style="padding:18px"><div class="h1" style="font-size:32px">רעיונות שהופכים למוצר.</div><span class="btn" style="font-size:20px">התחל</span></div>
    <div class="cards" style="padding:16px"><div class="card" style="background:var(--lav)"></div><div class="card" style="background:var(--orange)"></div></div>
  </div>
  <!-- FINALE: all three in a row -->
  <div style="position:absolute;left:50%;top:46%;display:flex;align-items:flex-end;gap:34px;opacity:0;animation:popinC 1s cubic-bezier(.2,1.5,.4,1) 9.3s both">
    <div class="dev desktop" style="position:static;transform:none;width:620px;height:390px"><div class="bar"><span class="bdot" style="background:var(--pink)"></span><span class="bdot" style="background:var(--yellow)"></span><span class="brand latin">STUDIO</span></div><div class="hero"><div class="h1" style="font-size:38px">רעיונות למוצר.</div><span class="btn" style="font-size:20px">התחל</span></div><div class="cards"><div class="card" style="background:var(--lav);height:80px"></div><div class="card" style="background:var(--cyan);height:80px"></div></div></div>
    <div class="dev tablet" style="position:static;transform:none;width:240px;height:330px"><div class="bar" style="height:42px"><span class="bdot" style="background:var(--pink)"></span><span class="brand latin" style="font-size:16px">STUDIO</span></div><div class="hero" style="padding:14px"><div class="h1" style="font-size:26px">למוצר.</div></div><div class="cards" style="padding:14px"><div class="card" style="background:var(--orange);height:70px"></div></div></div>
    <div class="dev phone" style="position:static;transform:none;width:170px;height:330px"><div class="bar" style="height:38px"><span class="bdot" style="background:var(--pink)"></span></div><div class="hero" style="padding:12px"><div class="h1" style="font-size:22px">למוצר.</div></div><div class="cards" style="padding:12px"><div class="card" style="background:var(--lime);height:60px"></div></div></div>
  </div>

  <!-- SIDE ICONS: emotions (appear at "מעורר"), arrows (appear at "מקדם") -->
  <svg class="icon" style="--r:-8deg;left:150px;top:240px;width:150px;animation:popin .6s cubic-bezier(.2,1.6,.4,1) 3.5s both,fl 3s ease-in-out 3.5s infinite,emofade .5s ease 6.2s forwards" viewBox="0 0 100 100"><path d="M50 86 C16 62 10 36 30 24 C44 16 50 30 50 36 C50 30 56 16 70 24 C90 36 84 62 50 86Z" fill="var(--pink)" stroke="#111" stroke-width="5"/></svg>
  <svg class="icon" style="--r:7deg;left:170px;top:470px;width:140px;animation:popin .6s cubic-bezier(.2,1.6,.4,1) 4.0s both,fl 3.2s ease-in-out 4s infinite,emofade .5s ease 6.2s forwards" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="var(--yellow)" stroke="#111" stroke-width="5"/><circle cx="37" cy="42" r="5" fill="#111"/><circle cx="63" cy="42" r="5" fill="#111"/><path d="M32 60 Q50 78 68 60" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/></svg>

  <svg class="icon" style="--r:6deg;right:160px;top:250px;width:150px;animation:popin .55s cubic-bezier(.2,1.6,.4,1) 6.6s both,fl 3s ease-in-out 6.6s infinite" viewBox="0 0 100 100"><path d="M14 40 H64 V22 L92 50 L64 78 V60 H14 Z" fill="var(--lime)" stroke="#111" stroke-width="5"/></svg>
  <svg class="icon" style="--r:-7deg;right:200px;top:470px;width:130px;animation:popin .55s cubic-bezier(.2,1.6,.4,1) 7.0s both,fl 3.2s ease-in-out 7s infinite" viewBox="0 0 100 100"><path d="M14 40 H64 V22 L92 50 L64 78 V60 H14 Z" fill="var(--cyan)" stroke="#111" stroke-width="5"/></svg>
  <svg class="icon" style="--r:10deg;right:120px;top:660px;width:110px;animation:popin .55s cubic-bezier(.2,1.6,.4,1) 7.4s both,fl 2.8s ease-in-out 7.4s infinite" viewBox="0 0 100 100"><path d="M14 40 H64 V22 L92 50 L64 78 V60 H14 Z" fill="var(--orange)" stroke="#111" stroke-width="5"/></svg>

  <div class="cap" style="animation:capshow 2.7s ease .3s both">עיצוב מוצר דיגיטלי הוא לא רק <span style="white-space:nowrap">איך שהוא נראה</span></div>
  <div class="cap" style="animation:capshow 2.9s ease 3.3s both">אלא גם בהרגשה שהוא מעורר</div>
  <div class="cap" style="animation:capshow 2.5s ease 6.5s both">ובפעולה שהוא מקדם</div>
  <div class="cap" style="animation:capshow 4.5s ease 9.3s both">מוצר טוב — הופך <span style="color:var(--pink);-webkit-text-stroke:2px #111">למוצר מנצח</span></div>

</div></div>
<div class="trans in"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="trans out" style="--t0:13.5s"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</body></html>
