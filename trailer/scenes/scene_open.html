<!doctype html><html lang="he"><head><meta charset="utf-8">
<link rel="stylesheet" href="../frames/base.css">
<style>
  body{background:var(--bg)}
  /* ONE device that physically morphs desktop -> tablet -> phone */
  .device{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);
    background:var(--paper);border:6px solid var(--ink);border-radius:18px;overflow:hidden;
    box-shadow:16px 18px 0 rgba(0,0,0,.18);width:980px;height:600px;
    animation:morph 14s cubic-bezier(.6,0,.4,1) 0s both, devin .6s cubic-bezier(.2,1.4,.4,1) 0s both}
  @keyframes devin{0%{opacity:0}100%{opacity:1}}
  @keyframes morph{
    0%{width:980px;height:600px;border-radius:18px}
    27%{width:980px;height:600px;border-radius:18px}      /* ~3.8s desktop */
    35%{width:560px;height:720px;border-radius:24px}       /* ~4.9s tablet */
    56%{width:560px;height:720px;border-radius:24px}       /* ~7.8s tablet */
    64%{width:330px;height:700px;border-radius:40px}       /* ~9.0s phone */
    100%{width:330px;height:700px;border-radius:40px}}
  .bar{height:58px;background:#f4f4f4;border-bottom:4px solid var(--ink);display:flex;align-items:center;gap:10px;padding:0 18px}
  .bdot{width:15px;height:15px;border-radius:50%;border:2px solid var(--ink)}
  .brand{margin-inline-start:auto;font-weight:900;font-size:22px}
  .site{padding:26px}
  .h1{font-weight:900;font-size:46px;line-height:.98;color:var(--ink)}
  .btn{display:inline-block;margin-top:14px;background:var(--lime);border:4px solid var(--ink);
    border-radius:999px;font-weight:800;font-size:24px;padding:.28em 1em;box-shadow:5px 5px 0 var(--ink)}
  .cards{display:flex;flex-wrap:wrap;gap:16px;margin-top:24px}
  .card{flex:1 1 220px;min-width:220px;height:150px;border:4px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink)}

  .icon{position:absolute;filter:drop-shadow(8px 8px 0 rgba(0,0,0,.16))}
  @keyframes emoLife{0%{opacity:0;transform:translateY(-24px) scale(.4) rotate(var(--r,0deg))}
    14%{opacity:1;transform:translateY(0) scale(1) rotate(var(--r,0deg))}
    68%{opacity:1;transform:translateY(0) scale(1) rotate(var(--r,0deg))}
    100%{opacity:0;transform:translateY(150px) scale(.5) rotate(var(--r,0deg))}}
  @keyframes arrLife{0%{opacity:0;transform:translateX(46px) scale(.4) rotate(var(--r,0deg))}
    60%{opacity:1;transform:translateX(-6px) scale(1.06) rotate(var(--r,0deg))}
    100%{opacity:1;transform:translateX(0) scale(1) rotate(var(--r,0deg))}}
  @keyframes fl{0%,100%{translate:0 0}50%{translate:0 -10px}}

  .cap{position:absolute;left:60px;right:60px;bottom:58px;text-align:center;color:var(--ink);
    font-weight:900;font-size:78px;line-height:1.04;text-shadow:4px 4px 0 var(--paper);opacity:0}
  @keyframes capshow{0%{opacity:0;transform:translateY(26px)}12%{opacity:1;transform:translateY(0)}86%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-12px)}}
</style></head>
<body>
<div class="livingbg"><b></b><b></b><b></b><b></b><b></b></div>
<div class="content"><div class="stage">

  <div class="device">
    <div class="bar"><span class="bdot" style="background:var(--pink)"></span><span class="bdot" style="background:var(--yellow)"></span><span class="bdot" style="background:var(--lime)"></span><span class="brand latin">STUDIO</span></div>
    <div class="site">
      <div class="h1">רעיונות שהופכים<br>למוצר.</div>
      <span class="btn">בואו נתחיל</span>
      <div class="cards">
        <div class="card" style="background:var(--lav)"></div>
        <div class="card" style="background:var(--cyan)"></div>
        <div class="card" style="background:var(--orange)"></div>
      </div>
    </div>
  </div>

  <!-- EMOTIONS first (appear, hold, fall away ~6.3s) -->
  <svg class="icon" style="--r:-8deg;left:150px;top:230px;width:130px;animation:emoLife 3.0s ease 3.3s both" viewBox="0 0 100 100"><path d="M50 86 C16 62 10 36 30 24 C44 16 50 30 50 36 C50 30 56 16 70 24 C90 36 84 62 50 86Z" fill="var(--pink)" stroke="#111" stroke-width="5"/></svg>
  <svg class="icon" style="--r:7deg;left:200px;top:470px;width:120px;animation:emoLife 2.8s ease 3.7s both" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="var(--yellow)" stroke="#111" stroke-width="5"/><circle cx="37" cy="42" r="5" fill="#111"/><circle cx="63" cy="42" r="5" fill="#111"/><path d="M32 60 Q50 78 68 60" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/></svg>
  <svg class="icon" style="--r:10deg;left:120px;top:700px;width:110px;animation:emoLife 2.7s ease 4.1s both" viewBox="0 0 100 100"><path d="M50 86 C16 62 10 36 30 24 C44 16 50 30 50 36 C50 30 56 16 70 24 C90 36 84 62 50 86Z" fill="var(--orange)" stroke="#111" stroke-width="5"/></svg>
  <svg class="icon" style="--r:6deg;right:170px;top:250px;width:130px;animation:emoLife 3.0s ease 3.5s both" viewBox="0 0 100 100"><path d="M50 86 C16 62 10 36 30 24 C44 16 50 30 50 36 C50 30 56 16 70 24 C90 36 84 62 50 86Z" fill="var(--lime)" stroke="#111" stroke-width="5"/></svg>
  <svg class="icon" style="--r:-9deg;right:150px;top:500px;width:120px;animation:emoLife 2.8s ease 3.9s both" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="var(--cyan)" stroke="#111" stroke-width="5"/><circle cx="37" cy="42" r="5" fill="#111"/><circle cx="63" cy="42" r="5" fill="#111"/><path d="M30 58 Q50 74 70 58" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/></svg>

  <!-- ARROWS next (appear ~6.6, stay) -->
  <svg class="icon" style="--r:6deg;left:160px;top:300px;width:140px;animation:arrLife .6s cubic-bezier(.2,1.6,.4,1) 6.6s both,fl 3s ease-in-out 6.6s infinite" viewBox="0 0 100 100"><path d="M14 40 H64 V22 L92 50 L64 78 V60 H14 Z" fill="var(--lime)" stroke="#111" stroke-width="5"/></svg>
  <svg class="icon" style="--r:-7deg;left:190px;top:560px;width:120px;animation:arrLife .6s cubic-bezier(.2,1.6,.4,1) 7.0s both,fl 3.2s ease-in-out 7s infinite" viewBox="0 0 100 100"><path d="M14 40 H64 V22 L92 50 L64 78 V60 H14 Z" fill="var(--blue)" stroke="#111" stroke-width="5"/></svg>
  <svg class="icon" style="--r:6deg;right:170px;top:320px;width:140px;animation:arrLife .6s cubic-bezier(.2,1.6,.4,1) 6.8s both,fl 3s ease-in-out 6.8s infinite" viewBox="0 0 100 100"><path d="M14 40 H64 V22 L92 50 L64 78 V60 H14 Z" fill="var(--orange)" stroke="#111" stroke-width="5"/></svg>
  <svg class="icon" style="--r:-6deg;right:200px;top:560px;width:120px;animation:arrLife .6s cubic-bezier(.2,1.6,.4,1) 7.2s both,fl 3.2s ease-in-out 7.2s infinite" viewBox="0 0 100 100"><path d="M14 40 H64 V22 L92 50 L64 78 V60 H14 Z" fill="var(--pink)" stroke="#111" stroke-width="5"/></svg>

  <div class="cap" style="animation:capshow 2.7s ease .3s both">עיצוב מוצר דיגיטלי הוא לא רק <span style="white-space:nowrap">איך שהוא נראה</span></div>
  <div class="cap" style="animation:capshow 2.9s ease 3.3s both">אלא גם בהרגשה שהוא מעורר</div>
  <div class="cap" style="animation:capshow 2.5s ease 6.5s both">ובפעולה שהוא מקדם</div>
  <div class="cap" style="animation:capshow 4.5s ease 9.3s both">מוצר טוב — הופך <span style="color:var(--pink);-webkit-text-stroke:2px #111">למוצר מנצח</span></div>

</div></div>
</body></html>
