<!doctype html><html lang="he"><head><meta charset="utf-8">
<link rel="stylesheet" href="../frames/base.css">
<style>
  body{background:var(--bg)}
  @keyframes rise{0%{opacity:0;transform:translateY(50px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes stamp{0%{opacity:0;transform:scale(1.7) rotate(-2deg)}60%{opacity:1;transform:scale(.94) rotate(-2deg)}100%{opacity:1;transform:scale(1) rotate(-2deg)}}
  @keyframes pop{0%{opacity:0;transform:scale(.5)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
  @keyframes fl{0%,100%{translate:0 0}50%{translate:0 -12px}}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .l1{font-size:200px;line-height:.92;font-weight:900;color:var(--ink);text-align:center;
    opacity:0;animation:rise .55s cubic-bezier(.2,1.3,.4,1) .15s both}
  .l2{margin-top:10px;font-size:210px;line-height:.9;font-weight:900;font-style:normal;
    background:var(--pink);color:var(--paper);padding:.01em .16em;box-shadow:14px 14px 0 var(--ink);
    display:inline-block;opacity:0;transform:rotate(-2deg);animation:stamp .55s cubic-bezier(.2,1.5,.4,1) .9s both}
  .cta{margin-top:56px;font-size:72px;font-weight:800;color:var(--paper);
    background:var(--ink);border-radius:999px;padding:.28em 1.1em;box-shadow:12px 12px 0 rgba(0,0,0,.25);
    opacity:0;animation:pop .5s cubic-bezier(.2,1.5,.4,1) 1.6s both}
  .cta .latin{color:var(--lime)}
  .foot{position:absolute;left:0;right:0;bottom:48px;display:flex;align-items:center;justify-content:center;
    gap:18px;font-size:48px;font-weight:800;color:var(--ink);opacity:0;animation:rise .5s ease 2.0s both}
  .st{position:absolute;filter:drop-shadow(8px 8px 0 rgba(0,0,0,.16));animation:fl 3s ease-in-out infinite}
</style></head>
<body>
<div class="livingbg"><b></b><b></b><b></b><b></b><b></b></div>
<div class="content"><div class="stage">
  <svg class="st" style="left:160px;top:180px;width:130px" viewBox="0 0 100 100"><polygon points="50,8 92,50 50,92 8,50" fill="var(--blue)" stroke="#111" stroke-width="4"/><polygon points="50,30 70,50 50,70 30,50" fill="var(--yellow)"/></svg>
  <svg class="st" style="right:170px;top:190px;width:120px;animation-delay:.5s" viewBox="0 0 100 100"><path d="M20 80 L52 16 L72 40 Z" fill="var(--orange)" stroke="#111" stroke-width="4"/><circle cx="52" cy="64" r="6" fill="#111"/></svg>
  <svg class="st" style="left:120px;bottom:230px;width:110px;animation-delay:.8s" viewBox="0 0 100 100"><path d="M50 12 C70 12 88 30 88 50 C88 78 50 92 50 92 C50 92 12 78 12 50 C12 30 30 12 50 12Z" fill="var(--pink)" stroke="#111" stroke-width="4"/></svg>
  <svg class="st" style="right:130px;bottom:250px;width:100px;animation-delay:.3s" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="var(--lime)" stroke="#111" stroke-width="4"/><rect x="32" y="32" width="36" height="36" fill="var(--blue)" transform="rotate(45 50 50)"/></svg>
  <svg class="st" style="left:90px;top:520px;width:90px;animation-delay:1s" viewBox="0 0 100 100"><path d="M50 6 L60 40 L96 50 L60 60 L50 94 L40 60 L4 50 L40 40 Z" fill="var(--cyan)" stroke="#111" stroke-width="4"/></svg>

  <div class="wrap">
    <div class="l1">הופכים רעיונות</div>
    <div class="l2">למציאות.</div>
    <div class="cta">מתחילים לעצב עכשיו · <span class="latin">קמפוס IL</span></div>
  </div>
  <div class="foot"><span>בעברית</span><span>•</span><span>בחינם</span><span>•</span><span class="latin">app.campus.gov.il</span></div>
</div></div>
</body></html>
