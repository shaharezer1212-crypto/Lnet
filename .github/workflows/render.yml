name: Render KudoZ

on:
  push:
    branches:
      - claude/kind-hopper-hnf487
  workflow_dispatch:

# A new push cancels any render still in progress for this branch, so the
# latest commit gets a runner immediately instead of queueing behind stale runs.
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full edit and the clean plate render in parallel on separate runners, so the
  # wall-clock is ~one 4K render instead of two back-to-back.
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/kind-hopper-hnf487
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Render full video
        run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: kudoz-main
          path: out/kudoz.mp4

  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/kind-hopper-hnf487
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Render clean plate (no added text, white graphics beats)
        run: npm run render:clean
      - uses: actions/upload-artifact@v4
        with:
          name: kudoz-clean
          path: out/kudoz-clean.mp4

  # Fast review render of just the ending section (frame range of the full
  # composition, so narration + music line up exactly).
  ending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/kind-hopper-hnf487
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Render ending section only
        run: npm run render:ending
      - uses: actions/upload-artifact@v4
        with:
          name: kudoz-ending
          path: out/kudoz-ending.mp4

  music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/kind-hopper-hnf487
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Download original full-length track
        run: |
          mkdir -p out
          curl -sS -L --retry 4 --retry-delay 2 \
            -o out/kudoz-music.m4a \
            "https://d8j0ntlcm91z4.cloudfront.net/user_2was4m5nNqvV4UXqUb4RJpsZmoC/hf_20260618_073734_ab535d97-c8a5-4a92-a397-b558551d91f3.m4a"
      - name: Render the music exactly as heard in the video (bed only, no VO)
        run: npm run render:music
      - name: List outputs
        run: ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: kudoz-music
          path: |
            out/kudoz-music.m4a
            out/kudoz-music-invideo.mp3
