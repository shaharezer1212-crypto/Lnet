name: Render KudoZ

on:
  push:
    branches:
      - claude/kind-hopper-hnf487
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/kind-hopper-hnf487

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Render video
        run: npm run render

      - name: Render clean plate (no added text, white screenshots)
        run: npm run render:clean

      - name: Download background music (separate file)
        run: |
          mkdir -p out
          curl -sS -L --retry 4 --retry-delay 2 \
            -o out/kudoz-music.m4a \
            "https://d8j0ntlcm91z4.cloudfront.net/user_2was4m5nNqvV4UXqUb4RJpsZmoC/hf_20260618_073734_ab535d97-c8a5-4a92-a397-b558551d91f3.m4a"
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kudoz-video
          path: |
            out/kudoz.mp4
            out/kudoz-clean.mp4
            out/kudoz-music.m4a
